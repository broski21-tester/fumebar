<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101112">
  <title>Fume Bar | Menu</title>
  <meta name="description" content="Explore the Fume Bar menu. Lebanese favourites, sushi, breakfast and more at Lancaster Plaza, Beirut.">
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="shared.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#menuRoot" id="skipLink">Skip to menu</a>
  <header class="topbar">
    <a class="wordmark" href="#top" aria-label="Fume Bar home">FUME<span>BAR</span></a>
    <div class="lang-switch" role="group" aria-label="Language">
      <button id="langEn" type="button" lang="en" aria-pressed="true">EN</button>
      <button id="langAr" type="button" lang="ar" aria-label="العربية" aria-pressed="false">عربي</button>
    </div>
  </header>
  <section class="hero" id="top" aria-labelledby="heroName">
    <img class="hero-logo" id="heroLogo" src="img/logo.jpg" alt="" width="170" height="170">
    <h1 class="sr-only" id="heroName">Fume Bar</h1>
    <p class="hero-tagline" id="heroTagline">Restaurant · Lounge · Sushi</p>
    <div class="hero-meta" id="heroMeta"></div>
  </section>
  <div class="menu-shell">
    <aside class="menu-sidebar">
      <p class="eyebrow" id="navLabel">Explore the menu</p>
      <nav class="catnav" id="catnav" aria-labelledby="navLabel"></nav>
    </aside>
    <main id="menuRoot" class="menu-root" tabindex="-1">
      <div class="menu-heading"><h2 id="menuTitle">The menu</h2><span class="currency-note" id="currencyNote">Prices in USD</span></div>
      <div class="menu-search">
        <label for="menuSearch" id="searchLabel">Find a dish</label>
        <div class="search-input-row"><input id="menuSearch" type="search" placeholder="Search item names…" autocomplete="off" aria-controls="menuSections" dir="auto"><button id="clearSearch" type="button" class="btn-text" hidden>Clear</button></div>
        <p id="searchResults" class="search-results" role="status" aria-live="polite" aria-atomic="true" hidden></p>
      </div>
      <div class="notice" id="menuNotice" role="status" hidden></div>
      <div class="state" id="stateLoading" role="status"><span class="spinner" aria-hidden="true"></span><p id="loadingText">Preparing your menu…</p></div>
      <div class="state" id="stateError" role="alert" hidden><h3 id="errorTitle">The menu is taking a moment</h3><p id="errorDetail">Please check your connection and try again.</p><button class="btn-primary" id="btnRetry" type="button">Try again</button></div>
      <div id="menuSections"></div>
      <div class="state" id="stateEmpty" hidden><p id="emptyText">The menu is being updated. Please check back shortly.</p></div>
      <noscript><p>Please enable JavaScript to view the menu.</p></noscript>
    </main>
  </div>
  <footer class="footer"><span class="wordmark">FUME<span>BAR</span></span><div id="footerLinks" class="footer-links"></div><p id="footerNote"></p></footer>
</body>
</html>
